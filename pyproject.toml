[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-agent-langgraph"
version = "1.1.0"
description = "基于 LangGraph 的代码审查 Agent（课程作业提交版）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "python-dotenv>=1.0,<2.0",
    "rich>=13.0,<16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
]

[project.scripts]
code-review-agent = "cli:main"

[tool.setuptools]
packages = ["agent", "tools"]
py-modules = ["cli", "config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
